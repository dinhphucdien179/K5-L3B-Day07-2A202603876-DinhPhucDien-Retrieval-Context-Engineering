services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: day6_lab
      POSTGRES_USER: day6
      POSTGRES_PASSWORD: day6_local_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day6 -d day6_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
  pipeline:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://day6:day6_local_only@postgres:5432/day6_lab
      DAY6_TEST_DATABASE_URL: postgresql://day6:day6_local_only@postgres:5432/day6_test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace/starter
      - ../data:/workspace/data
      - ../benchmark:/workspace/benchmark
      - ../results:/workspace/results
      - ../artifacts:/workspace/artifacts
      - ../.cache:/workspace/.cache
      - ../pytest.ini:/workspace/pytest.ini:ro
volumes:
  pg_data:
